name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install browsers
        run: npx playwright install --with-deps chromium webkit

      - name: Validate packages
        run: npm run check

      - name: Validate browser behavior
        run: npm run check:e2e

      - name: Upload browser failure artifacts
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: browser-failure-${{ github.run_id }}
          path: |
            apps/docs/e2e/**/*-linux.png
            apps/docs/test-results
          if-no-files-found: warn
          retention-days: 7

      - name: Inspect publishable tarballs
        run: npm run check:pack

  visual-regression:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install chromium

      - name: Build Explorer
        run: npm run build

      - name: Validate canonical Windows visuals
        run: npm run test:e2e --workspace @allfitone/docs -- --grep "matches"

      - name: Upload visual failure artifacts
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: visual-failure-${{ github.run_id }}
          path: apps/docs/test-results
          if-no-files-found: warn
          retention-days: 7
