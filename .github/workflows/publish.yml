name: Publish to npm

on:
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  id-token: write

concurrency:
  group: publish-npm

jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: npm
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Require successful CI for this main commit
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ci_run_id=""
          for attempt in {1..12}; do
            ci_run_id="$(gh run list \
              --workflow ci.yml \
              --branch main \
              --commit "$GITHUB_SHA" \
              --limit 1 \
              --json databaseId \
              --jq '.[0].databaseId // empty')"
            if [ -n "$ci_run_id" ]; then
              break
            fi
            sleep 10
          done

          if [ -z "$ci_run_id" ]; then
            echo "No CI run exists for main commit $GITHUB_SHA."
            exit 1
          fi

          gh run watch "$ci_run_id" --exit-status

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Use the repository npm version
        run: npm install --global npm@11.11.0

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Validate release
        run: npm run check:release

      - name: Publish unpublished versions
        run: npm run release
